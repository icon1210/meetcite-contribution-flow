name: Show merged contribution

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Show contribution in the run summary
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          {
            echo "## MeetCite contribution merged"
            echo
            echo "| Contributor | Pull request | Merged |"
            echo "|---|---|---|"
            printf '| @%s | [#%s: %s](%s) | %s |\n' "$PR_AUTHOR" "$PR_NUMBER" "$PR_TITLE" "$PR_URL" "$MERGED_AT"
            echo
            printf 'This record identifies the pull request author. See [Team contributions](https://github.com/%s/blob/%s/docs/TEAM_CONTRIBUTIONS.md) for team context.\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
